name: Build and publish spider-core

on:
    push:
        branches:
            - main
        tags:
            - "v*"
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install build tools
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install build

            - name: Build package
              run: python -m build

    publish:
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Twine
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install twine

            - name: Publish to Artifactory
              env:
                  TWINE_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
                  TWINE_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
                  ARTIFACTORY_REPOSITORY_URL: ${{ secrets.ARTIFACTORY_REPOSITORY_URL }}
              run: |
                  python -m twine upload --repository-url "$ARTIFACTORY_REPOSITORY_URL" dist/*
